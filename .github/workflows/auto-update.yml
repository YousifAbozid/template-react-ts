name: 🔄 Auto Dependency Updater

on:
  schedule:
    - cron: '0 0 * * 0' # every sunday at 12:00 AM UTC (adjust as needed)
  workflow_dispatch: # allow manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # or your project's version

      - name: 📦 Upgrade dependencies (Fail-Safe)
        run: |
          set -e  # Exit on any error

          # Create logs directory
          mkdir -p logs
          LOG_FILE="logs/dependency-update-$(date +%Y%m%d-%H%M%S).log"

          log_with_timestamp() {
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$LOG_FILE"
          }

          log_with_timestamp "🔍 Starting dependency update process..."
          log_with_timestamp "🔍 Backing up original package.json..."
          cp package.json package.json.backup

          # Log current dependency versions
          log_with_timestamp "📋 Current dependency versions:"
          npm list --depth=0 2>/dev/null | tee -a "$LOG_FILE" || echo "Could not list current dependencies" | tee -a "$LOG_FILE"

          log_with_timestamp "📋 Installing npm-check-updates..."
          npm install -g npm-check-updates 2>&1 | tee -a "$LOG_FILE"

          log_with_timestamp "🔄 Checking for available updates..."
          ncu --format json > logs/available-updates.json 2>/dev/null || echo "{}" > logs/available-updates.json
          ncu 2>&1 | tee -a "$LOG_FILE"

          log_with_timestamp "🔄 Upgrading dependencies..."
          ncu -u 2>&1 | tee -a "$LOG_FILE"

          # Log what changed
          log_with_timestamp "📝 Package.json changes:"
          if diff package.json.backup package.json > logs/package-diff.txt; then
            log_with_timestamp "No changes detected in package.json"
          else
            cat logs/package-diff.txt | tee -a "$LOG_FILE"
          fi

          log_with_timestamp "🧪 Testing npm install after upgrades..."
          if npm install 2>&1 | tee -a "$LOG_FILE"; then
            log_with_timestamp "✅ npm install succeeded after upgrades"
          else
            log_with_timestamp "❌ npm install failed after upgrades - capturing error details"
            log_with_timestamp "Error occurred during npm install. Check logs for details."
            log_with_timestamp "Reverting package.json to original state..."
            cp package.json.backup package.json
            exit 1
          fi

          log_with_timestamp "🔒 Running npm audit fix..."
          if npm audit fix --json 2>&1 | tee logs/audit-results.json | tee -a "$LOG_FILE"; then
            log_with_timestamp "✅ npm audit fix completed"
          else
            log_with_timestamp "⚠️ npm audit fix had issues, but continuing..."
          fi

          log_with_timestamp "🧪 Final verification with npm install..."
          if npm install 2>&1 | tee -a "$LOG_FILE"; then
            log_with_timestamp "✅ Final npm install verification passed"
            
            # Log final dependency versions
            log_with_timestamp "📋 Final dependency versions:"
            npm list --depth=0 2>/dev/null | tee -a "$LOG_FILE" || echo "Could not list final dependencies" | tee -a "$LOG_FILE"
          else
            log_with_timestamp "❌ Final verification failed - capturing detailed error information"
            log_with_timestamp "This indicates a dependency conflict or compatibility issue"
            
            # Try to get more specific error information
            log_with_timestamp "🔍 Attempting to diagnose the issue..."
            npm ls --depth=0 2>&1 | tee -a "$LOG_FILE" || true
            
            log_with_timestamp "🔙 Reverting all changes..."
            cp package.json.backup package.json
            npm install 2>&1 | tee -a "$LOG_FILE"
            log_with_timestamp "⚠️ Dependency update skipped due to conflicts - check logs for details"
            exit 0
          fi

          log_with_timestamp "🧹 Cleaning up backup..."
          rm package.json.backup
          log_with_timestamp "✅ Dependency update process completed successfully"

      - name: 📊 Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: 🧠 Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            echo "📝 Changes detected, committing..."
            git add .
            git commit -m "chore: 🔄 auto-dependency upgrade"
            git push origin ${{ github.ref_name }}
            echo "✅ Successfully pushed dependency updates"
          else
            echo "✅ No changes to commit"
          fi
